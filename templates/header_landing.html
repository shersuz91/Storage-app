<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
</head>
{% block style %}{% endblock %}
<style>
.mainContainer{
    display: grid;
    grid-template-columns:1fr 85% ;
    grid-template-rows: 70px 1fr 60px;
    grid-template-areas: "header header "
                         "side main " 
                         "footer footer ";
    height: 100vh;
}
header{
    grid-area: header;
}
side{
    grid-area: side;
}
main{
    grid-area:main;
}
footer{
    grid-area:footer;
}
</style>
<body>
    <div class="mainContainer">

        <header class="d-flex flex-wrap align-items-center justify-content-between p-3 border-bottom border-info"> 
            <img src="logo" class="img-fluid" id="logo-head"> <!--Create a logo for app to go here -T-->
            <div>
                <a type="button" class="btn {% if request.path == '/' %} btn-info{% else %}btn-outline-info{% endif %} me-2" id="home" type="submit" href="{{url_for('home')}}">Home </a> 
                {% if "id" in session %}
                    <a class="btn me-2 {% if request.path == '/dashboard' %} btn-info{% else %}btn-outline-info{% endif %} " href="{{url_for("dashboard")}}">Dashboard</a>
                    <button class="bg-transparent border-0 text-white">{{session["username"]}} <i class="fs-4 bi bi-person-circle"></i></button>
                {% else %}
                <a type="button" class="btn {% if request.path == '/login' %}btn btn-info{% else %}btn-outline-info{% endif %} me-2" id="login-signup" type="submit" href="{{url_for('login')}}">Login </a> 
                <a type="button" class="btn {% if request.path == '/signup' %}btn btn-info{% else %}btn-outline-info{% endif %} me-2" id="login-signup" type="submit" href="{{url_for('signup')}}">Sign-up</a> 
            </div>
                {% endif %}
        </header> 
         {% if "id" in session %}
    <side class="bg-dark p-2">
        <nav>
            <ul class="p-0 m-0 ">
                <li class="p-2 "><a class="btn me-2 {% if request.path == '/dashboard' %} btn-info{% else %}btn-outline-info{% endif %} text-start border border-1 rounded-2 w-100 d-block" href="{{url_for("dashboard")}}">Dashboard</a></li>
                <li class="p-2 "><a href="{{url_for("profile")}}" class="text-white p-2 border border-1 rounded-2 w-100 d-block">Profile</a></li>
                <li class="p-2 "><a href="#" class="text-white p-2 border border-1 rounded-2 w-100 d-block">Favorite</a></li>
                <li class="p-2 "><a href="{{url_for("logOut")}}" class="text-white p-2 border border-1 rounded-2 w-100 d-block">Log Out</a></li>
            </ul>
        </nav>
    </side>
                {% endif %}

    <main class="p-4">
        
{% block main %}
{% endblock %}
    </main>

<footer id="footer" class="d-flex flex-wrap justify-content-center gap-2 align-items-center py-2 fixed-bottom border-top border-info"> 
        <span>Our Github pages: </span>
        <a type="button" class="btn btn-outline-info " id="login-signup" type="submit" href="https://github.com/spikeyhairedbeastgirl-beep">Tess</a>
        <a type="button" class="btn btn-outline-info " id="login-signup" type="submit" href="https://github.com/shersuz91">Sherman</a>
    </footer>
    </div>

    <script src="../static/JS/app.js"></script>
    {% block script %}{% endblock %}
</body>
</html>
