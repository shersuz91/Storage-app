<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
{% block style %}{% endblock %}

<body>
    <div id="header" class="container"> 
        <header class="d-flex flex-wrap align-items-center justify-content-between  py-3 mb-4 border-bottom border-info"> 
            <img src="logo" class="img-fluid" id="logo-head"> <!--Create a logo for app to go here -T-->
            <div>
                <a type="button" class="btn {% if request.path == '/' %}btn btn-info{% else %}btn-outline-info{% endif %} me-2" id="home" type="submit" href="{{url_for('home')}}">Home </a> 
                {% if "id" in session %}
                    <a class="btn btn-outline-info me-2" href="{{url_for("dashboard")}}">Dashboard</a>
                    <button class="bg-transparent border-0 text-white">{{session["username"]}} <i class="fs-4 bi bi-person-circle"></i></button>
                {% else %}
                <a type="button" class="btn {% if request.path == '/login' %}btn btn-info{% else %}btn-outline-info{% endif %} me-2" id="login-signup" type="submit" href="{{url_for('login')}}">Login </a> 
                <a type="button" class="btn {% if request.path == '/signup' %}btn btn-info{% else %}btn-outline-info{% endif %} me-2" id="login-signup" type="submit" href="{{url_for('signup')}}">Sign-up</a> 
            </div>
                {% endif %}
        </header> 
    </div>
{% block main %}
{% endblock %}


<footer id="footer" class="d-flex flex-wrap justify-content-center fixed-bottom py-3 mb-4 border-top border-info"> 
        Our Github pages: 
        <a type="button" class="btn btn-outline-info me-2" id="login-signup" type="submit" href="https://github.com/spikeyhairedbeastgirl-beep">Tess</a>
        <a type="button" class="btn btn-outline-info me-2" id="login-signup" type="submit" href="https://github.com/shersuz91">Sherman</a>
    </footer>
</body>
</html>
